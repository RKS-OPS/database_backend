get:
  summary: Get all users starting with a given prefix
  tags:
    - users
  operationId: getAllusers
  parameters:
    - in: query
      name: prefix
      required: false
      schema:
        type: string
      description: Filter users by name (prefix match)
  responses:
    "200":
      description: A list of users
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../schemas/User.yaml"
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
