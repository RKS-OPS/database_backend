get:
  summary: Get all organizations
  operationId: getAllOrganizations
  parameters:
    - in: query
      name: ministry
      required: false
      schema:
        type: string
      description: get all divisions for the ministry
    - in: query
      name: division
      required: false
      schema:
        type: string
      description: get all branches for the division
  responses:
    "200":
      description: A list of ministry or division
      content:
        application/json:
          schema:
            type: array
            items:
              anyOf:
                - type: object
                  properties:
                    id:
                      type: number
                      description: The unique identifier for the organization
                    name:
                      type: string
                      description: The name of the organization
                - type: string
