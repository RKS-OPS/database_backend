get:
  summary: Get all users
  operationId: getAllusers
  responses:
    "200":
      description: A list of users
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../schemas/User.yaml"
post:
  summary: Create a new user
  operationId: createUser
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/User.yaml"
  responses:
    "201":
      description: user created
