get:
  summary: Get all projects
  operationId: getAllProjects
  parameters:
    - name: id
      in: query
      schema:
        type: string
      description: Project ID (supports partial match)
    - name: status
      in: query
      schema:
        type: string
      description: Project status
    - name: startDate
      in: query
      schema:
        type: string
        format: date
      description: Filter projects created on or after this date
    - name: endDate
      in: query
      schema:
        type: string
        format: date
      description: Filter projects created on or before this date
    - name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number for pagination
    - name: limit
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
      description: Number of items per page
  responses:
    "200":
      description: A paginated list of projects
      content:
        application/json:
          schema:
            type: object
            properties:
              projects:
                type: array
                items:
                  $ref: "../../schemas/Project.yaml"
              totalCount:
                type: integer
                description: The total number of projects matching the query
post:
  summary: Create a new project
  operationId: createProject
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../schemas/ProjectDetail.yaml"
  responses:
    "201":
      description: Project created
