get:
  summary: Search for partial match project Ids
  operationId: searchProjectIds
  parameters:
    - name: id
      in: query
      required: true
      schema:
        type: string
      description: Project ID
  responses:
    "200":
      description: A list of matching project IDs
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
    "404":
      description: No matching projects found
